<!DOCTYPE html>
<html>
    <head>
        <title>Task-3</title>
         <style>
            label{
                display:inline-block;
                width:200px;
            }
            input{
                border: 1px solid black;
            }
        </style>
    </head>
<body>
    <center>
    <h2><b>Registration Form</b></h2>
    <div id="registration-fields" role="form" aria-label="Registration details">
        <label for="id">ID:</label>
        <input type="text" id="id" name="id"><br><br>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="course">Course:</label>
        <input type="text" id="course" name="course"><br><br>
        <label for="branch">Branch:</label>
        <input type="text" id="branch" name="branch"><br><br>
        <label for="rollno">Roll no:</label>
        <input type="number" id="rollno" name="rollno"><br><br>
        <label for="email">Email_Address:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="username">Username:</label>
        <input type="text" id="user_name" name="username"><br><br>
        <label for="about">About us:</label>
        <textarea id="about" name="about" style="width: 225px;height:40px;"></textarea><br><br>
        <label for="password">Password</label>
        <input type="password" id="password" name="password"><br><br>
        <input type="button" id="registration-submit" value="add">
        <p id="registration-status" role="status" aria-live="polite"></p>
    </div>
    </center>
    <script>
        document.getElementById("registration-submit").addEventListener("click", () => {
            document.getElementById("registration-status").textContent =
                "Registration is a visual demo; no registration service is connected.";
        });
    </script>
</body>
</html>
