<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8">
        <title>Animated Login Form</title>
        <link rel="stylesheet" href="style2.css">
    </head>
    <body>
        <div class="center"></div>
        <h1>Login</h1>
        <div id="login-form" role="form" aria-label="Sign in">
            <div class="textfield">
                <input type="text" name="username" autocomplete="username" required>
                <label>Username</label>
            </div>
            <div class="txt_field">
                <input type="password" name="password" autocomplete="current-password" required>
                <label>Password</label>
            </div>
            <div class="pass">Forgot password?</div>
            <input type="button" id="login-button" value="login">
            <p id="login-status" role="status" aria-live="polite"></p>
            <div class="signup_link">
                Not a member?<a href="#">Signup</a>
            </div>
        </div>
    </body>
    <script>
        const loginForm = document.getElementById("login-form");
        const loginInputs = loginForm.querySelectorAll('input[type="text"], input[type="password"]');

        function showDemoStatus() {
            for (const input of loginInputs) {
                if (!input.reportValidity()) {
                    return;
                }
            }
            document.getElementById("login-status").textContent =
                "Sign-in is unavailable because no authentication service is configured.";
        }

        document.getElementById("login-button").addEventListener("click", showDemoStatus);
        loginForm.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                showDemoStatus();
            }
        });
    </script>
</html>
